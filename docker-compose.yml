services:
  db:
    image: pgvector/pgvector:pg17
    container_name: sv-nemotron-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nemotron}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nemotron}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["poc"]
    build: .
    container_name: sv-nemotron-poc
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POC_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-nemotron}
      DATA_CATALOG_PATH: /app/src/data/audited-catalog.json
      LFM3_MODEL_DIR: /app/models
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-onnx-community/embeddinggemma-2-ONNX}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
